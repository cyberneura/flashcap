[package]
name = "flashcap"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flashcap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
base64 = "0.22"
chrono = "0.4"
tauri-plugin-drag = "2.1.0"
tauri-plugin-single-instance = "2.3.7"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
dirs = "6"
tokio = { version = "1", features = ["process", "time"] }
tauri-plugin-deep-link = "2.4.7"

[target.'cfg(unix)'.dependencies]
# 一時ディレクトリの祖先の所有者検査 (getuid)。std には現在の uid を取る API が無い
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# 範囲選択オーバーレイをフルスクリーンアプリの Space 上にも出すため、
# NSWindow の collectionBehavior / level を直接設定する
objc = "0.2"
# CGWindowList (ウィンドウスナップ用のウィンドウ境界列挙) の CF 型ラッパー
core-foundation = "0.10"


