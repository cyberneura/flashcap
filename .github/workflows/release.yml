name: Release

# リリースは手動実行 (workflow_dispatch) のみ。push では自動ビルドしない。
# ローカルからは `pnpm release` で起動する。
# PR では test ジョブだけが走る (build 以降は if で止めてある)。門番のテストを
# マージ前に同じ定義で回すためで、リリース経路とテストの内容がずれない。
on:
  workflow_dispatch:
  pull_request:

# 既定は権限なし。必要な job にだけ与える。特に test は PR が持ち込んだコードを
# 実行するので contents: read までしか渡さない (同一リポジトリからの PR では
# GITHUB_TOKEN が write を持ちうるため、ここを既定に任せない)。
#
# この workflow は pull_request でも起動するが、「PR で workflow 自体を書き換えれば
# contents: write のジョブを動かせる」ことにはならない。public リポジトリの fork から
# の pull_request では、permissions の記述に関わらず GITHUB_TOKEN が read-only に
# 切り下げられ secrets も渡らない (write token を渡す設定があるのは private リポジトリ
# 側の話で、ここには無い)。同一リポジトリのブランチから PR を出せるのは既に write
# 権限を持つ相手だけなので、そちらも権限の昇格にはならない。
permissions: {}

# 同時に走らないよう直列化する。1 回の dispatch が 1 つの version に対応するため、
# キャンセルされた run の version は (bump コミットは main に載ったまま) 永久に公開
# されない状態になる。走行中を守る cancel-in-progress: false だけでは不十分で、
# 既定の queue: single は pending を 1 件しか保持せず、新しい dispatch が既存 pending を
# 置き換えてしまう (走行中 1 + dispatch 2 回で真ん中の version が消える)。queue: max は
# pending を 100 件まで積む。queue: max と cancel-in-progress: true の併用は不可。
#
# PR の検査 run は「1 dispatch = 1 version」の直列化とは無関係なので、リリース用の
# グループへ入れない。同じグループにすると PR が 1 本走るだけでリリースが pending に
# 積まれる (cancel-in-progress: false なので待たされ続ける)。さらに commit ごとに
# 別グループにして、PR 側では直列化そのものを効かせない — ここで PR をまとめると
# 同じ PR へ連続 push した時に古い commit の検査が順番待ちを作り、最新 commit の
# 結果が最も遅れる (この設定では cancel-in-progress を PR だけ true にはできない)。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.sha) || 'release' }}
  cancel-in-progress: false
  queue: max

jobs:
  # リリースビルドの門番。方針: cyberneura/cyberneura-github-actions の
  # docs/build-requires-tests.md
  #
  # runs-on を build と同じ macOS にしてあるのは方針のルール 4 による。lib.rs は
  # screencapture / sips / NSPasteboard を叩く macOS 専用コードで、ubuntu では
  # そもそもコンパイルが通らない (通ったとしても配布物と別のコードを検査したことになる)。
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # ビルド用ではないので universal の 2 アーキは要らない。ホストターゲットでテストする。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable

      - name: Cache Rust (cargo + target)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # cargo test でも build.rs は走る。tauri-build は frontendDist (../build) が
      # 実在しないとアプリのコードへ到達する前に落ちるので、先にフロントを作る。
      - name: Build frontend
        run: pnpm build

      - name: Type-check frontend
        run: pnpm check

      - name: Run frontend tests
        run: pnpm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # flashcap は macOS 専用アプリ (screencapture / Vision Framework 依存) なので
  # macOS のみビルドする。Intel / Apple Silicon 両対応の universal dmg を配布する。
  build:
    # test を通らずにビルドしない。needs は同じ run の job にしか効かないので、
    # テストを別 workflow に切り出さないこと。
    needs: test
    # PR では成果物を作らない (Apple の証明書を PR のコードに触らせないためでもある)。
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: write
    # Rust キャッシュが空の状態での universal (2 アーキ) ビルドに加えて、
    # Apple の公証サービス待ちが読めないので長めに取る。ハングした時の
    # 上限であって通常はここまで使わない (実測は 10〜20 分程度)。
    timeout-minutes: 90

    steps:
      # persist-credentials: false — checkout が write 権限の GITHUB_TOKEN を
      # .git/config に残さないようにする。以降のステップ (pnpm install の
      # install script や third-party action) がそれを拾えないようにするため。
      # Release 操作に必要な token は各ステップへ env で明示的に渡している。
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # SHA は master 履歴から選ぶ (master 先端)。`@stable` の指す SHA は生成ブランチ
      # stable の先端で、それを pin すると stable が進んだ時に commit が GC され、
      # 以降の run が Rust セットアップ前に落ちる。ref から toolchain を推測できない分、
      # toolchain: stable を明示する。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust (cargo + target)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Secret が欠けていると署名・公証が「失敗」ではなく**黙ってスキップ**される。
      # APPLE_SIGNING_IDENTITY が空だと tauri.conf.json の signingIdentity "-" に
      # フォールバックして ad-hoc 署名になり、APPLE_ID 等が空だと公証も行われないまま
      # Release が公開されてしまう (見た目は成功する)。ここで先に落とす。
      - name: Verify signing secrets are present
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Signing and notarization would be silently skipped."
            exit 1
          fi
          echo "All signing and notarization secrets are present."

      # Developer ID 証明書を一時 keychain にインポートする。tauri-action 自身は
      # 証明書をインポートしないため、ビルド前にこのステップで用意しておく。
      # keychain のパスワードは使い捨てなので Secret にせずその場で生成する。
      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          # 検索リストにも入れる。codesign は default keychain ではなく検索リストから
          # identity を引くため。default-keychain だけでも実際には通る (arcvault の
          # 同一手順で公証済み dmg がビルドできている) が、runner イメージの既定に
          # 依存しないよう明示しておく。
          security list-keychains -d user -s build.keychain
          # 検索リスト経由で Developer ID が引けることをここで確認し、駄目なら即失敗させる
          # (find-identity は identity が 0 件でも exit 0 なので grep で判定する)。
          # ビルドの奥で「identity が無い」と落ちるより原因が分かりやすい。
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "Developer ID Application" || {
            echo "Error: no 'Developer ID Application' identity in the keychain search list" >&2
            exit 1
          }
          rm "$RUNNER_TEMP/certificate.p12"

      # tauri.conf.json の version から v<version> タグの Release を作成し、
      # ビルド成果物をアップロードする。ビルドが途中で失敗しても不完全な Release が
      # 公開されないよう draft で作成し、成功後に publish ジョブで公開する。
      # 注意: 公開済みバージョンと同じ version で再実行すると、tauri-action が
      # draft 状態の不一致でエラーになる。必ず version を上げてから実行すること
      # (`pnpm release` が自動で採番する)。
      # APPLE_* を渡すと tauri-action が Developer ID 署名 + 公証 + staple を行う。
      # このジョブは Apple の秘密鍵入り証明書を keychain に置くため、`uses:` は
      # すべて可変タグではなく commit SHA に固定してある (タグが差し替えられると
      # 証明書や secrets を抜かれるサプライチェーン攻撃が成立するため)。
      # 更新するときも `# v0` 等のコメントを頼りに SHA で指定し直すこと。
      - name: Build and upload to GitHub Release (draft)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # tauriScript を明示しないと、tauri-action は pnpm プロジェクトに対して
          # `pnpm tauri build` を実行する (runner.ts: usesPnpm -> Runner('pnpm', ['tauri']))。
          # それだと package.json の `tauri` スクリプトが走り、そこに書かれた
          # インラインの APPLE_SIGNING_IDENTITY=... が上の env を上書きしてしまう
          # (シェルのインライン代入は継承した env より優先される)。結果、CI が
          # Secret ではなくローカル用にハードコードされた identity で署名しようとする。
          # `pnpm exec tauri` は package.json のスクリプトを経由せず CLI を直接叩くので、
          # Secret の値がそのまま効く。ローカルの `pnpm tauri build` は従来どおり。
          tauriScript: pnpm exec tauri
          tagName: v__VERSION__
          releaseName: FlashCap v__VERSION__
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin --bundles dmg

  # ビルド・アップロードが成功した時のみ draft を公開する。
  # 失敗した場合は draft のまま残る (不完全な Release は公開されない)。
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release edit "v${VERSION}" --draft=false --latest
